# ============================================================================
# config.conf — Arch Linux 安装配置文件
# ============================================================================
# 所有可调整的系统参数集中在这里, 修改后保存, 再运行 install.sh 即可生效。
# 每项都有注释说明, 按需修改; 未列出的内部变量请勿改动。
#
# 注意: 本文件被 install.sh 以 source 方式加载, 语法需为合法的 bash 赋值。

# --- 目标磁盘 --------------------------------------------------------------
# 留空则自动检测 (仅一块磁盘时自动选中) 或手动选择。
TARGET_DISK=""

# --- 安装模式 --------------------------------------------------------------
FORMAT_ESP=true        # 是否格式化 ESP (全盘=true, 共存/重装复用=false)
INSTALL_DESKTOP=true   # 是否安装桌面环境 (GNOME + THIRD_PARTY), false 仅部署基础系统
INSTALL_ROCM=true      # 是否安装 ROCm (AMD GPU 计算平台, 添加约 1.5GB 软件包)

# --- 阶段跳过后继续机制 ----------------------------------------------------
# 设置已完成的 PHASE 编号, 脚本跳过前面的阶段直接从中断处恢复。
# 例子: RESUME_FROM=3   → 跳过 Phase 0/1/2, 从 Phase 3 (pacstrap) 开始
#       RESUME_FROM=""  → 从头安装 (默认)
RESUME_FROM=""

# --- 系统参数 --------------------------------------------------------------
TIMEZONE="Asia/Shanghai"                # 系统时区
SYSTEM_LOCALE="zh_CN.UTF-8"             # 系统语言 / 界面语言
HOSTNAME="archlinux"                    # 主机名
KEYMAP="us"                             # 控制台键盘布局
MIRROR_COUNTRY="China"                  # 镜像源国家 (reflector 联网排序 + 预设 fallback)
                                        # 可用值: China / Japan / United States / Germany /
                                        #         Singapore / United Kingdom / Australia /
                                        #         South Korea / Taiwan / Hong Kong / India / France

# archlinuxcn 社区仓库镜像 (保留 $arch 字面量, 反斜杠是必需的)
ARCHLINUXCN_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/archlinuxcn/\$arch"

ZRAM_SIZE="ram / 2"                     # ZRAM 压缩交换大小
SSH_PORT=22                             # SSH 监听端口
